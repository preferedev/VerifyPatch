name: VerifyPatch

on:
  pull_request:

permissions:
  contents: read

# Prefer ephemeral GitHub-hosted runners. VerifyPatch executes untrusted
# repository tests. Reusable self-hosted runners can be persistently
# compromised unless you isolate them. Do not pass repository secrets
# into this job.
#
# Third-party Actions are pinned to immutable commit SHAs. This workflow
# dogfoods the composite Action from the pull request checkout.

jobs:
  verifypatch:
    name: Independent verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pull request HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install repository dependencies
        run: python -m pip install -e .

      - name: Run VerifyPatch
        uses: ./
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}

      - name: Upload reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verifypatch-report
          path: |
            verifypatch.json
            verifypatch.md
