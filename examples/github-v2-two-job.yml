name: VerifyPatch v2 (two-job)

on:
  pull_request:

permissions:
  contents: read

# Prefer ephemeral GitHub-hosted runners. VerifyPatch executes untrusted
# repository tests. Never use the pull_request target event. Do not pass
# repository secrets into the execution job.
#
# The requirements job installs a pinned published VerifyPatch release and
# treats the pull request checkout only as input data. It must never install
# the subject repository, import its Python, or run from its working tree.
# The provider key exists only in that trusted extraction step.
#
# Third-party Actions are pinned to immutable commit SHAs. Until 0.2.0 is
# published, exercise this logic locally with a built wheel; keep this
# documented workflow pinned to verifypatch==0.2.0.

env:
  VERIFYPATCH_VERSION: "0.2.0"

jobs:
  verifypatch-requirements:
    name: Extract requirements
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pull request HEAD as input data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: subject
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install trusted VerifyPatch from PyPI
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install "verifypatch[openai]==${VERIFYPATCH_VERSION}"
          mkdir -p "${{ runner.temp }}/pp-req"

      - name: Extract requirements without executing head code
        working-directory: ${{ runner.temp }}/pp-req
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONNOUSERSITE: "1"
          PYTHONPATH: ""
          PYTHONSAFEPATH: "1"
        run: |
          python -m verifypatch verify \
            --root "${GITHUB_WORKSPACE}/subject" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --requirements-only \
            --json-out "${{ runner.temp }}/pp-req/requirements.json" \
            --md-out "${{ runner.temp }}/pp-req/requirements.md"

      - name: Validate requirements artifact
        working-directory: ${{ runner.temp }}/pp-req
        env:
          SUBJECT_ROOT: ${{ github.workspace }}/subject
          PYTHONNOUSERSITE: "1"
          PYTHONPATH: ""
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from jsonschema import Draft202012Validator
          from verifypatch.config import load_v2_config
          from verifypatch.requirements.artifact import load_requirements_artifact
          from verifypatch.schema import load_schema

          payload = json.loads(Path("requirements.json").read_text(encoding="utf-8"))
          Draft202012Validator(load_schema("2")).validate(payload)
          root = Path(os.environ["SUBJECT_ROOT"])
          merge = str((payload.get("resolved_refs") or {}).get("merge_base") or "")
          _result, err = load_requirements_artifact(
              Path("requirements.json"),
              root=root,
              merge_base=merge,
              config=load_v2_config(root),
          )
          if err:
              raise SystemExit(err.message)
          Path("validation.json").write_text(
              json.dumps({"ok": True, "source_digests": "validated"}, indent=2) + "\n",
              encoding="utf-8",
          )
          print("requirements artifact validated against schema and exact merge-base citation ranges")
          PY

      - name: Upload requirement artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verifypatch-requirements
          path: |
            ${{ runner.temp }}/pp-req/requirements.json
            ${{ runner.temp }}/pp-req/requirements.md
            ${{ runner.temp }}/pp-req/validation.json

  verifypatch-verify:
    name: Independent verification
    needs: verifypatch-requirements
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pull request HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install repository dependencies
        run: python -m pip install -e .

      - name: Install trusted VerifyPatch from PyPI
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install "verifypatch==${VERIFYPATCH_VERSION}"
          mkdir -p "${{ runner.temp }}/pp-verify"

      - name: Download requirement artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verifypatch-requirements
          path: ${{ runner.temp }}/pp-verify

      - name: Run VerifyPatch (no provider key)
        working-directory: ${{ runner.temp }}/pp-verify
        env:
          PYTHONNOUSERSITE: "1"
          PYTHONPATH: ""
          PYTHONSAFEPATH: "1"
        run: |
          python -m verifypatch verify \
            --root "${GITHUB_WORKSPACE}" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --requirements-file "${{ runner.temp }}/pp-verify/requirements.json" \
            --json-out "${{ runner.temp }}/pp-verify/verifypatch.json" \
            --md-out "${{ runner.temp }}/pp-verify/verifypatch.md"

      - name: Upload reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verifypatch-report
          path: |
            ${{ runner.temp }}/pp-verify/verifypatch.json
            ${{ runner.temp }}/pp-verify/verifypatch.md
            ${{ runner.temp }}/pp-verify/requirements.json
            ${{ runner.temp }}/pp-verify/validation.json
